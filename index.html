
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">

</head>
<body class="bg-light">
    <nav class="navbar bg-body-tertiary designer">
        <div class="container-fluid">
            <a class="navbar-brand title">Sistemas De Alunos</a>
            <form class="d-flex" role="search" id="form">
                <input id="campoBusca" class="form-control me-2" type="search" placeholder="Digite o nome..." aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Pesquisar</button>
            </form>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mt-5">Lista de Alunos</h3>
                    <a href="form.html" class="btn btn-success mt-5">Novo Aluno</a>
                </div>

                <div id="loading" style="display:none;" class="mb-3"></div>
                <div id="message" style="display:none;" class="mb-3"></div>

                <div class="card">
                    <div class="card-body p-1">
                        <div class="table-responsive">
                            <table id="alunos-table" class="table table-sm table-hover mb-0 ">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-center align-middle">ID</th>
                                        <th class="text-center align-middle">Nome</th>
                                        <th class="text-center align-middle">Turma</th>
                                        <th class="text-center align-middle">Curso</th>
                                        <th class="text-center align-middle">Matricula</th>
                                        <th class="text-center align-middle">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="text-center align-middle">
                                    <!-- alunos -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white py-3 border-top">
        <div class="container text-center text-muted">&copy; 2025 - Prática 06 - Programação Web - Newton Paiva</div>
    </footer>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
